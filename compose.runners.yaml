services:
  orchestration-runner:
    image: ${RUNNER_IMAGE:-filius-builder:local}
    environment:
      GITHUB_URL: ${GITHUB_URL:?GITHUB_URL is required}
      RUNNER_TOKEN: ${RUNNER_TOKEN:?RUNNER_TOKEN is required}
      RUNNER_NAME: ${RUNNER_NAME:?RUNNER_NAME is required}
      RUNNER_LABELS: self-hosted,linux,x64,docker-orchestrate

  build-runner:
    image: ${RUNNER_IMAGE:-filius-builder:local}
    volumes:
      - type: bind
        source: ${DOCKER_SOCKET:?DOCKER_SOCKET must point to filius-runner's rootless Docker socket}
        target: /var/run/docker.sock
    environment:
      GITHUB_URL: ${GITHUB_URL:?GITHUB_URL is required}
      RUNNER_TOKEN: ${RUNNER_TOKEN:?RUNNER_TOKEN is required}
      RUNNER_NAME: ${RUNNER_NAME:?RUNNER_NAME is required}

  deployment-runner:
    image: ${RUNNER_IMAGE:-filius-deployer:local}
    volumes:
      - type: bind
        source: ${DOCKER_SOCKET:?DOCKER_SOCKET must point to filius-runner's rootless Docker socket}
        target: /var/run/docker.sock
      - type: bind
        source: ${FILIUS_DEPLOYMENTS_DIR:?FILIUS_DEPLOYMENTS_DIR is required}
        target: ${FILIUS_DEPLOYMENTS_DIR:?FILIUS_DEPLOYMENTS_DIR is required}
    environment:
      GITHUB_URL: ${GITHUB_URL:?GITHUB_URL is required}
      RUNNER_TOKEN: ${RUNNER_TOKEN:?RUNNER_TOKEN is required}
      RUNNER_NAME: ${RUNNER_NAME:?RUNNER_NAME is required}
      FILIUS_DEPLOYMENTS_DIR: ${FILIUS_DEPLOYMENTS_DIR:?FILIUS_DEPLOYMENTS_DIR is required}
