name: Build runner image

on:
  push:
    paths:
      - "build-runner/Dockerfile"
      - "build-runner/runner-entrypoint.sh"
      - "build-runner/build.sh"
      - "deployment-runner/Dockerfile"
      - "deployment-runner/build.sh"
      - ".github/workflows/build-runner-image.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-runner-image:
    name: Rebuild runner images
    runs-on: [self-hosted, docker-build]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build runner image in rootless Docker
        run: bash build-runner/build.sh

      - name: Build deployment runner image
        run: bash deployment-runner/build.sh

      - name: Verify runner images
        run: |
          docker image inspect filius-builder:local --format '{{.Id}}'
          docker image inspect filius-deployer:local --format '{{.Id}}'
