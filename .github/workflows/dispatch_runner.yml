name: Dispatch runner

on:
  workflow_dispatch:

permissions: {}

jobs:
  discover-build-work:
    runs-on: [self-hosted, docker-orchestrate]
    timeout-minutes: 10
    steps:
      - name: Request eligible build queue scan
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d /filius-control/requests || ! -d /filius-control/results ]]; then
            echo "::error::Host control mount directories are missing. Reinstall the server runtime with setup.sh following README's safe upgrade procedure; pushing workflows does not update /usr/local/lib/filius. Do not create container-local directories."
            exit 1
          fi
          export REQUEST_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$REQUEST_ID" =~ ^[1-9][0-9]{0,19}-[1-9][0-9]{0,5}$ ]]
          request="/filius-control/requests/${REQUEST_ID}.request"
          result="/filius-control/results/${REQUEST_ID}.json"
          (set -o noclobber; : > "$request")
          deadline=$((SECONDS + 480))
          until [[ -f "$result" ]]; do
            if ((SECONDS >= deadline)); then
              echo "::error::Host scan timed out; inspect filius-dispatch.path/service and the build-worker journal."
              exit 1
            fi
            sleep 2
          done
          jq -e '.request_id == env.REQUEST_ID' "$result" >/dev/null
          cat "$result"
          jq -e '.ok == true' "$result" >/dev/null
